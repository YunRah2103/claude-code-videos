name: Zernio video scheduling
on:
  push:
    branches: [ccr-e1faef6c-0xpkp7]
    paths:
      - .github/workflows/zernio-publish.yml
      - 'publishing/zernio/**'
    tags:
      - 'zernio-approve/*'
      - 'zernio-status/*'

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.ref == 'refs/heads/ccr-e1faef6c-0xpkp7'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s publishing/zernio -v

  authorize:
    if: >-
      github.repository == 'YunRah2103/claude-code-videos' &&
      github.actor == 'YunRah2103' && github.triggering_actor == 'YunRah2103' &&
      github.event.created && !github.event.deleted && !github.event.forced &&
      startsWith(github.ref, 'refs/tags/zernio-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      command: ${{ steps.tag.outputs.command }}
      commit: ${{ steps.tag.outputs.commit }}
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ccr-e1faef6c-0xpkp7
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the owner tag points to a working branch commit
        id: tag
        shell: bash
        run: |
          commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$commit" HEAD
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/tags/zernio-approve/$commit" ]]; then
            echo "command=schedule" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/zernio-status/([0-9a-f]{64})-[0-9]+$ ]]; then
            echo "command=status" >> "$GITHUB_OUTPUT"
            echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid Zernio tag. See publishing/zernio/README.md."
            exit 1
          fi

  schedule:
    needs: authorize
    if: needs.authorize.outputs.command == 'schedule'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - name: Upload the approved MP4 and schedule both platforms
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: python3 publishing/zernio/publish.py schedule publishing/zernio/request.json

  publication-status:
    needs: authorize
    if: needs.authorize.outputs.command == 'status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - name: Check TikTok and YouTube publication status
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          VIDEO_SHA256: ${{ needs.authorize.outputs.digest }}
        run: python3 publishing/zernio/publish.py status "$VIDEO_SHA256"
